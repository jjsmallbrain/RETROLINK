<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retro Link player</title>
  <style>
    html, body { height: 100%; margin: 0; background: #000; color: #ddd; font-family: ui-monospace, Menlo, Consolas, monospace; }
    #game { width: 100%; height: 100%; }
    #msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; margin: 0; line-height: 1.5; }
    #msg[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="game"></div>
  <p id="msg">Loading emulator...</p>
  <script src="js/config.js"></script>
  <script src="js/play.js"></script>
</body>
</html>
