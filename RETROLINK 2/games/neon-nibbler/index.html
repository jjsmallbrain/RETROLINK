<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Nibbler</title>
<style>
  html, body { height: 100%; margin: 0; background: #101010; color: #39ff88; font-family: ui-monospace, Menlo, Consolas, monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  canvas { max-width: 96vw; max-height: 84vh; aspect-ratio: 1; border: 2px solid #39ff88; background: #000; }
  #hud { font-size: 16px; }
</style>
</head>
<body>
<div id="hud">Score 0 | Arrow keys or WASD to move</div>
<canvas id="c" width="400" height="400"></canvas>
<script>
// Neon Nibbler: a small original snake-style demo made for Retro Link.
const N = 20, S = 20;
const c = document.getElementById("c"), g = c.getContext("2d"), hud = document.getElementById("hud");
let snake, dir, next, food, score, dead, timer;

function reset() {
  snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
  dir = {x: 1, y: 0}; next = dir; score = 0; dead = false;
  placeFood(); draw(); hud.textContent = "Score 0 | Arrow keys or WASD to move";
  clearInterval(timer); timer = setInterval(step, 110);
}
function placeFood() {
  do { food = {x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N)}; }
  while (snake.some(s => s.x === food.x && s.y === food.y));
}
function step() {
  dir = next;
  const h = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || snake.some(s => s.x === h.x && s.y === h.y)) {
    dead = true; clearInterval(timer);
    hud.textContent = "Game over. Score " + score + " | Press Space or Enter to play again";
    return;
  }
  snake.unshift(h);
  if (h.x === food.x && h.y === food.y) { score++; hud.textContent = "Score " + score; placeFood(); }
  else snake.pop();
  draw();
}
function draw() {
  g.fillStyle = "#000"; g.fillRect(0, 0, 400, 400);
  g.fillStyle = "#ff3df2"; g.fillRect(food.x * S + 3, food.y * S + 3, S - 6, S - 6);
  snake.forEach((s, i) => { g.fillStyle = i ? "#39ff88" : "#c8ffe0"; g.fillRect(s.x * S + 1, s.y * S + 1, S - 2, S - 2); });
}
const keys = { ArrowUp: [0,-1], w: [0,-1], ArrowDown: [0,1], s: [0,1], ArrowLeft: [-1,0], a: [-1,0], ArrowRight: [1,0], d: [1,0] };
addEventListener("keydown", e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (keys[k]) {
    e.preventDefault();
    const [x, y] = keys[k];
    if (x !== -dir.x || y !== -dir.y) next = {x, y};
  } else if ((k === " " || k === "Enter") && dead) { e.preventDefault(); reset(); }
});
// Touch: swipe to steer, tap to restart
let t0;
c.addEventListener("touchstart", e => { t0 = e.touches[0]; if (dead) reset(); }, {passive: true});
c.addEventListener("touchend", e => {
  if (!t0) return;
  const dx = e.changedTouches[0].clientX - t0.clientX, dy = e.changedTouches[0].clientY - t0.clientY;
  const v = Math.abs(dx) > Math.abs(dy) ? [Math.sign(dx), 0] : [0, Math.sign(dy)];
  if (v[0] !== -dir.x || v[1] !== -dir.y) next = {x: v[0], y: v[1]};
}, {passive: true});
reset();
</script>
</body>
</html>
